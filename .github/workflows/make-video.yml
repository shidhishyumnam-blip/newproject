
name: Make Animated Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Enter your video topic"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate video
        run: |
          python main.py \
            --topic "${{ inputs.topic }}" \
            --output short.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: finished-short
          path: short.mp4
          retention-days: 3
          
